<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Mano Chat Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#090b10; --panel:#131722; --gold:#f4bd4f; --muted:#9ca3b3; --line:#282e3d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Tahoma,Arial,sans-serif; background:radial-gradient(circle at 15% 0%,#2b2110 0,#090b10 38%),var(--bg); color:#fff; }
    .shell { width:min(680px,100%); margin:auto; padding:22px 16px 36px; }
    .brand { display:flex; align-items:center; gap:12px; padding:8px 4px 22px; }
    .mark { width:48px; height:48px; border-radius:16px; display:grid; place-items:center; color:#15110a; font-weight:900; font-size:23px; background:linear-gradient(135deg,#fff0ad,var(--gold) 50%,#9b5a0e); box-shadow:0 0 24px #f4bd4f44; }
    h1 { font-size:22px; margin:0 0 4px; } .subtitle { margin:0;color:var(--muted);font-size:13px; }
    .hero { border:1px solid #f4bd4f55; border-radius:24px; padding:22px; background:linear-gradient(135deg,#1c1b18,#121620 70%); box-shadow:0 16px 50px #0005; }
    .hero small { color:var(--gold); } .hero h2 { margin:8px 0 0; font-size:25px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px; }
    .card { border:1px solid var(--line); background:#11151fdd; border-radius:18px; padding:17px; min-height:100px; } .label{color:var(--muted);font-size:12px}.value{display:block;margin-top:10px;font-size:22px;font-weight:700;color:var(--gold)}
    .section { margin-top:16px; border:1px solid var(--line); border-radius:18px; padding:18px; background:#11151fcc; } .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #202635;font-size:14px}.row:last-child{border:0;padding-bottom:0}.row span:first-child{color:var(--muted)}
    .status { text-align:center; padding:42px 12px; color:var(--muted); } .error { color:#ff9d9d; } button { border:0;border-radius:13px;padding:11px 16px;background:var(--gold);color:#17120a;font-weight:bold;cursor:pointer;margin-top:18px; }
  </style>
</head>
<body>
  <main class="shell"><header class="brand"><div class="mark">M</div><div><h1>Mano Chat</h1><p class="subtitle">فضای اختصاصی تو در ربات</p></div></header><div id="app" class="status">در حال دریافت اطلاعات…</div></main>
<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();
  const app = document.getElementById('app');
  const fa = value => value === null || value === undefined || value === '' ? 'ثبت نشده' : String(value);
  const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  async function load() {
    if (!tg?.initData) { app.innerHTML='<div class="status error">این صفحه باید از داخل تلگرام باز شود.</div>'; return; }
    try {
      const response = await fetch('/api/miniapp', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({initData:tg.initData}) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error === 'mini_app_disabled' ? 'Mini App در حال حاضر توسط مالک غیرفعال است.' : 'احراز هویت انجام نشد.');
      const u = data.user;
      app.innerHTML = `<section class="hero"><small>داشبورد شخصی</small><h2>${esc(u.display_name || (u.username ? '@'+u.username : 'کاربر Mano'))}</h2><p class="subtitle">شناسه کاربری: ${esc(u.telegram_id)}</p></section><div class="grid"><div class="card"><span class="label">موجودی مانوکوین</span><strong class="value">${Number(u.coins||0).toLocaleString('en-US')}</strong></div><div class="card"><span class="label">وضعیت حساب</span><strong class="value">${u.plus_expires_at ? 'Mano Plus' : 'عادی'}</strong></div></div><section class="section"><div class="row"><span>سن</span><b>${esc(fa(u.age))}</b></div><div class="row"><span>کشور</span><b>${esc(fa(u.country_code))}</b></div><div class="row"><span>استان</span><b>${esc(fa(u.province_code))}</b></div><div class="row"><span>شهرستان</span><b>${esc(fa(u.county_code))}</b></div></section>`;
    } catch (error) { app.innerHTML = `<div class="status error">${esc(error.message || 'خطایی رخ داد')}<br><button onclick="location.reload()">تلاش دوباره</button></div>`; }
  }
  load();
</script>
</body>
</html>
