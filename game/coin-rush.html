<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin Rush دو نفره | ManoChat</title>
<style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#171d31;--line:#ffffff1b;--gold:#ffd166;--cyan:#67e8f9;--pink:#fb7185;--muted:#aab4cc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#293b63 0,#0c1020 52%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}.wrap{width:min(94vw,560px);margin:auto;padding:18px 0 24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.eyebrow{font-size:11px;color:var(--cyan);font-weight:800;letter-spacing:1.5px}.title{font-size:26px;font-weight:900;margin:2px 0}.room{font-size:11px;color:var(--muted);direction:ltr}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.score{position:relative;background:#ffffff0c;border:1px solid var(--line);border-radius:18px;padding:11px 13px;overflow:hidden}.score:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--cyan)}.score.opponent:before{background:var(--pink)}.score .label{color:var(--muted);font-size:11px}.score b{display:block;font-size:30px;color:var(--gold);line-height:1.1;margin-top:3px}.score .state{font-size:11px;color:#dbeafe}.bar{height:6px;background:#ffffff12;border-radius:8px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#818cf8);transition:width .2s}.opponent .bar i{background:linear-gradient(90deg,var(--pink),#f59e0b)}#status{background:#ffffff0b;border:1px solid var(--line);border-radius:14px;padding:10px 13px;text-align:center;color:#dbeafe;font-size:13px;margin-bottom:10px}.arena{position:relative;height:min(66vh,470px);min-height:360px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#ffffff0d,#ffffff03);box-shadow:0 18px 70px #0008;overflow:hidden;touch-action:manipulation}.arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:34px 34px}.coin{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid #fff9;background:radial-gradient(circle at 35% 28%,#fff4a3 0 12%,#ffd166 30%,#d58c0e 100%);box-shadow:0 0 0 6px #ffd16620,0 8px 22px #0008;display:grid;place-items:center;font-size:28px;cursor:pointer;animation:pop .12s ease-out;z-index:2}.coin:active{transform:scale(.82)}@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#0c1020d9;backdrop-filter:blur(8px);z-index:4}.card{width:min(92%,380px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 55px #0008}.card h2{margin:0 0 9px;font-size:22px}.card p{color:var(--muted);line-height:1.8;font-size:13px;margin:8px 0 18px}.btn{border:0;border-radius:999px;padding:13px 25px;font-weight:900;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#ffe29a,#ffb703);color:#211708;box-shadow:0 10px 24px #ffb70333}.btn:disabled{opacity:.45;cursor:wait}.ghost{margin-top:10px;background:#ffffff0d;color:#fff;border:1px solid var(--line);box-shadow:none}.result{font-size:44px;color:var(--gold);font-weight:900}.tiny{font-size:11px;color:#7f8ba4;text-align:center;margin-top:11px}.hide{display:none!important}.spark{position:absolute;color:#ffe6a2;font-weight:900;pointer-events:none;z-index:3;animation:float .65s ease-out forwards}@keyframes float{to{transform:translateY(-45px);opacity:0}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">MANOCHAT DUEL ROOM</div><div class="title">Coin Rush</div><div class="room" id="room">room</div></div><div style="font-size:34px">🪙</div></header>
<section class="scores"><div class="score"><span class="label">تو</span><b id="mine">0</b><span class="state" id="mineState">آماده نیستی</span><div class="bar"><i id="mineBar"></i></div></div><div class="score opponent"><span class="label">طرف مقابل</span><b id="other">0</b><span class="state" id="otherState">در حال ورود...</span><div class="bar"><i id="otherBar"></i></div></div></section>
<div id="status">در حال اتصال به اتاق بازی...</div>
<section class="arena" id="arena"><div id="overlay" class="overlay"><div class="card"><h2 id="overlayTitle">اتاق بازی</h2><p id="overlayText">در حال بررسی حضور هر دو بازیکن...</p><button id="ready" class="btn">آماده‌ام</button><button id="leave" class="btn ghost">خروج</button></div></div></section>
<div class="tiny">مسابقه ۳۰ ثانیه‌ای است؛ امتیاز هر دو نفر زنده به‌روزرسانی می‌شود.</div>
</main>
<script>
(()=>{
 const q=new URLSearchParams(location.search), room=q.get('room'), player=q.get('player'), token=q.get('token');
 const $=id=>document.getElementById(id), arena=$('arena'), overlay=$('overlay'), ready=$('ready'), leave=$('leave');
 let state=null, poll=null, coin=null, playing=false, maxScore=1;
 $('room').textContent=room?`اتاق ${room.slice(0,8)}`:'اتاق نامعتبر';
 const valid=room&&player&&token;
 async function api(action){const r=await fetch('/api/coin-rush/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,player,token,action})});if(!r.ok)throw new Error('api');const j=await r.json();return j.state}
 async function load(){if(!valid){fail('لینک بازی ناقص است. از داخل دعوت جدید وارد شوید.');return}try{const r=await fetch(`/api/coin-rush/state?room=${encodeURIComponent(room)}&player=${encodeURIComponent(player)}&token=${encodeURIComponent(token)}`);if(!r.ok)throw new Error('session');const j=await r.json();render(j.state)}catch{fail('اتاق بازی پیدا نشد یا منقضی شده است. یک دعوت جدید بسازید.')}}
 function fail(t){$('status').textContent=t;ready.disabled=true;overlay.classList.remove('hide');$('overlayTitle').textContent='بازی در دسترس نیست';$('overlayText').textContent=t}
 function render(s){state=s;maxScore=Math.max(1,s.score,s.opponentScore);$('mine').textContent=s.score;$('other').textContent=s.opponentScore;$('mineBar').style.width=Math.min(100,s.score/maxScore*100)+'%';$('otherBar').style.width=Math.min(100,s.opponentScore/maxScore*100)+'%';$('mineState').textContent=s.ready?'آماده':'آماده نیستی';$('otherState').textContent=s.opponentReady?'آماده است':'در حال آماده‌شدن...';
  if(s.status==='waiting'){playing=false;overlay.classList.remove('hide');$('overlayTitle').textContent=s.opponentReady?'هر دو آماده‌اید':'منتظر طرف مقابل';$('overlayText').textContent=s.opponentReady?'روی «آماده‌ام» بزن تا شمارش معکوس شروع شود.':'طرف مقابل هنوز وارد اتاق نشده یا آماده نشده است.';ready.textContent=s.ready?'منتظر شروع...':'آماده‌ام';ready.disabled=s.ready; $('status').textContent=s.opponentReady?'طرف مقابل آماده است؛ نوبت توست.':'حضور طرف مقابل در اتاق ثبت شد.';return}
  if(s.status==='active'){overlay.classList.add('hide');const left=s.remainingMs??0;if(s.countdownMs>0){playing=false;$('status').textContent=`شروع بازی تا ${Math.ceil(s.countdownMs/1000)}...`;removeCoin();}else if(left>0){playing=true;$('status').textContent=`${Math.ceil(left/1000)} ثانیه باقی مانده`;if(!coin)spawn();}else{playing=false;removeCoin()}return}
  if(s.status==='finished'){playing=false;removeCoin();overlay.classList.remove('hide');const result=s.score===s.opponentScore?'مساوی شد!':s.score>s.opponentScore?'بردی!':'این دور را باختی';$('overlayTitle').textContent='🏁 '+result;$('overlayText').textContent=`نتیجه نهایی: تو ${s.score} — طرف مقابل ${s.opponentScore}`;$('status').textContent='مسابقه تمام شد';ready.textContent='بستن';ready.disabled=false;return}
  if(s.status==='cancelled')fail('این اتاق بازی بسته شده است.');
 }
 function spawn(){if(!playing||coin)return;coin=document.createElement('button');coin.className='coin';coin.type='button';coin.textContent='🪙';coin.style.left=Math.round(5+Math.random()*Math.max(5,arena.clientWidth-76))+'px';coin.style.top=Math.round(5+Math.random()*Math.max(5,arena.clientHeight-76))+'px';coin.onclick=async e=>{if(!playing)return;const x=document.createElement('span');x.className='spark';x.textContent='+1';x.style.left=coin.offsetLeft+24+'px';x.style.top=coin.offsetTop+6+'px';arena.appendChild(x);setTimeout(()=>x.remove(),700);removeCoin();try{render(await api('hit'))}catch{}if(playing)setTimeout(spawn,110)};arena.appendChild(coin)}
 function removeCoin(){coin?.remove();coin=null}
 ready.onclick=async()=>{if(state?.status==='finished'){location.reload();return}ready.disabled=true;try{render(await api('ready'))}catch{fail('اتصال به اتاق بازی قطع شد.')}};
 leave.onclick=async()=>{try{await api('leave')}catch{}window.close();overlay.classList.add('hide');$('status').textContent='از بازی خارج شدی.'};
 load();poll=setInterval(load,700);window.addEventListener('beforeunload',()=>clearInterval(poll));
})();
</script></body></html>
