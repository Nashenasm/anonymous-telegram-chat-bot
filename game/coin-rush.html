<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Coin Rush | ManoChat</title>
  <style>
    :root{color-scheme:dark;--bg:#10131d;--panel:#191e2d;--gold:#ffd166;--cyan:#6ee7f9;--muted:#aeb8cc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#293353 0,#10131d 55%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;overflow:hidden}
    .wrap{width:min(94vw,520px);margin:auto;padding:22px 0}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand h1{font-size:25px;margin:0;letter-spacing:-.5px}.tag{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:1px}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}.stat{background:#ffffff0d;border:1px solid #ffffff18;border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--gold)}.stat span{font-size:11px;color:var(--muted)}
    #arena{position:relative;height:min(70vh,520px);min-height:390px;border:1px solid #ffffff1c;border-radius:26px;background:linear-gradient(145deg,#ffffff0d,#ffffff03);box-shadow:0 20px 80px #0006;overflow:hidden;touch-action:manipulation}
    #arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:34px 34px;opacity:.45}
    #hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:28px;line-height:1.8;pointer-events:none}.start{pointer-events:auto;border:0;border-radius:999px;padding:13px 28px;font-weight:800;font-size:16px;color:#19130b;background:linear-gradient(135deg,#ffe29a,#ffb703);box-shadow:0 10px 25px #ffb70333;cursor:pointer}
    .coin{position:absolute;width:62px;height:62px;border-radius:50%;border:3px solid #fff8;background:radial-gradient(circle at 35% 30%,#fff3a8 0 12%,#ffd166 30%,#e09b16 100%);box-shadow:0 0 0 5px #ffd16622,0 8px 20px #0007;display:grid;place-items:center;font-size:27px;cursor:pointer;animation:pop .12s ease-out;user-select:none}.coin:active{transform:scale(.84)}
    @keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}.float{position:absolute;color:#ffe6a2;font-weight:900;pointer-events:none;animation:float 650ms ease-out forwards}@keyframes float{to{transform:translateY(-45px);opacity:0}}
    #result{display:none;position:absolute;inset:0;background:#10131de8;backdrop-filter:blur(7px);place-items:center;text-align:center;padding:24px}.card{background:var(--panel);border:1px solid #ffffff1c;border-radius:22px;padding:25px;width:min(90%,350px)}.card h2{margin:0 0 10px}.big{font-size:52px;color:var(--gold);font-weight:900;margin:6px}.small{color:var(--muted);font-size:13px;margin-bottom:18px}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.secondary{border:1px solid #ffffff25;background:#ffffff0d;color:#fff;border-radius:999px;padding:12px 19px;font-weight:700;cursor:pointer}
    footer{text-align:center;color:#7f8ba4;font-size:11px;padding:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><div><div class="tag">MANOCHAT MINI GAME</div><h1>Coin Rush</h1></div><div>🪙</div></div>
    <section class="stats"><div class="stat"><b id="score">0</b><span>امتیاز</span></div><div class="stat"><b id="time">30</b><span>ثانیه</span></div><div class="stat"><b id="best">0</b><span>رکورد</span></div></section>
    <section id="arena" aria-label="زمین بازی">
      <div id="hint"><div><p>در ۳۰ ثانیه هرچه سکهٔ بیشتری بگیری امتیازت بالاتر می‌رود.</p><button class="start" id="start">شروع بازی</button></div></div>
      <div id="result"><div class="card"><h2>بازی تمام شد</h2><div class="big" id="final">0</div><div class="small" id="recordText">امتیاز تو ثبت شد.</div><div class="actions"><button class="start" id="again">دوباره بازی کن</button><button class="secondary" id="close">بستن</button></div></div></div>
    </section>
    <footer>نسخهٔ تستی — امتیازها فعلاً فقط روی همین دستگاه ذخیره می‌شوند.</footer>
  </main>
  <script>
    (() => {
      const arena=document.getElementById('arena'), hint=document.getElementById('hint'), result=document.getElementById('result');
      const scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), bestEl=document.getElementById('best');
      const finalEl=document.getElementById('final'), recordText=document.getElementById('recordText');
      let score=0,time=30,timer=null,active=false,coin=null;
      const key='manochat_coin_rush_best'; let best=Number(localStorage.getItem(key)||0); bestEl.textContent=best;
      function placeCoin(){ if(!active)return; coin?.remove(); coin=document.createElement('button'); coin.className='coin'; coin.type='button'; coin.textContent='🪙'; const maxX=Math.max(4,arena.clientWidth-70),maxY=Math.max(4,arena.clientHeight-70); coin.style.left=Math.round(4+Math.random()*maxX)+'px'; coin.style.top=Math.round(4+Math.random()*maxY)+'px'; coin.addEventListener('click',hit,{once:true}); arena.appendChild(coin); }
      function hit(e){ if(!active)return; score++; scoreEl.textContent=score; const f=document.createElement('span'); f.className='float'; f.textContent='+1'; f.style.left=e.target.offsetLeft+22+'px'; f.style.top=e.target.offsetTop+4+'px'; arena.appendChild(f); setTimeout(()=>f.remove(),700); placeCoin(); }
      function finish(){active=false;clearInterval(timer);timer=null;coin?.remove();coin=null;finalEl.textContent=score;if(score>best){best=score;localStorage.setItem(key,String(best));bestEl.textContent=best;recordText.textContent='رکورد جدید ثبت شد!';}else recordText.textContent='امتیاز تو ثبت شد.';result.style.display='grid';}
      function start(){score=0;time=30;active=true;scoreEl.textContent='0';timeEl.textContent='30';hint.style.display='none';result.style.display='none';placeCoin();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
      document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('close').onclick=()=>{result.style.display='none';hint.style.display='grid';scoreEl.textContent='0';timeEl.textContent='30'};
      window.addEventListener('resize',()=>{if(active)placeCoin()});
    })();
  </script>
</body>
</html>
