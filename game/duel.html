.ludo-scene{--ludo-ink:#eaf4ff;--ludo-muted:#9fb5cb;--ludo-panel:#0b1c32;--ludo-panel-2:#102943;--ludo-line:#2c4966;--ludo-gold:#f4c86b;background:linear-gradient(160deg,#071525,#0c2139 52%,#071321);border:1px solid #2c4966;border-radius:22px;box-shadow:0 18px 45px #0009,inset 0 1px #ffffff12}
.ludo-scene:before{background:radial-gradient(circle at 50% 8%,#2b86c522,transparent 38%),linear-gradient(180deg,#07152522,#030b16aa)}
.ludo-header{border-bottom:1px solid var(--ludo-line);padding:0 2px 10px}.ludo-kicker{color:var(--ludo-gold)}.ludo-heading{color:var(--ludo-ink);text-shadow:none}
.ludo-tools label,.dice-caption,.home-empty,.ludo-guide,.ludo-meta{color:var(--ludo-muted)}
.ludo-board-shell{background:linear-gradient(135deg,#203c58,#0d2035);border:1px solid #41617d;box-shadow:0 12px 30px #0008,inset 0 1px #ffffff22}
.ludo-board{background:#12283e;border-color:#1d405d;border-radius:14px;box-shadow:inset 0 0 18px #020b14,0 0 20px #0006}

.ludo-piece.selectable{outline:2px solid #ffe8a0;box-shadow:0 0 0 3px #ffe8a066,0 0 15px var(--piece-color)}
.ludo-home{background:linear-gradient(145deg,color-mix(in srgb,var(--yard-color) 45%,#0b1c32),#0b1c32);border:1px solid color-mix(in srgb,var(--yard-color) 75%,#91b8d6);box-shadow:0 8px 18px #0008}.home-label{color:var(--ludo-ink)}

.ludo-meta{background:var(--ludo-panel);border:1px solid var(--ludo-line);box-shadow:inset 0 1px #ffffff0c}.turn-indicator{box-shadow:0 0 10px color-mix(in srgb,var(--turn-color) 45%,transparent);border-color:var(--turn-color);background:#071525;color:var(--ludo-ink)}

.ludo-die{background:linear-gradient(145deg,#fffdf0,#f0bf53);border-color:#fff4cf;box-shadow:0 6px 20px #d9982d66;color:#2b1b06}
.ludo-guide{background:var(--ludo-panel-2);border-color:#31516c}.ludo-guide b{color:var(--ludo-gold)}

const occupants={};players.forEach(pl=>pl.pieces.forEach((pos,n)=>{const visual=ludoAnimatedPosition(pl,n,pos),cell=ludoCellFor(visual,pl.offset,pl.colorKey);if(cell)(occupants[cell.join(',')] ||= []).push({pl,n,pos:visual,real:pos})}));
const playerHome=pl=>`<div class="ludo-home home-slot-${pl.colorKey} ${pl.active&&Number(st.current)===Number(pl.id)?'turn-neon':''}" style="--yard-color:${pl.color}"><div class="home-label">${pl.you?'تو':'حریف'} · ${ludoColor(pl.colorKey).name}</div><div class="home-pieces">${pl.pieces.map((pos,n)=>pos<0?`<button class="home-token ${canPiece(pl.pieces,n)?'selectable':''}" data-piece="${canPiece(pl.pieces,n)?n:''}">${n+1}</button>`:'').join('')||'<span class="home-empty">در مسیر</span>'}</div></div>`;
const cells=Array.from({length:225},(_,i)=>{const r=Math.floor(i/15),col=i%15,idx=TRACK.findIndex(x=>x[0]===r&&x[1]===col),isPath=idx>=0,isCross=(r>=5&&r<=9)||(col>=5&&col<=9),isCorner=(r<5&&col<5)||(r<5&&col>9)||(r>9&&col<5)||(r>9&&col>9);let cls='ludo-cell '+(isPath?'path ':'')+(!isCross&&!isCorner?'outside ':'');if(LUDO_SAFE.includes(idx))cls+='safe ';if(r<5&&col<5)cls+='home-red ';if(r<5&&col>9)cls+='home-yellow ';if(r>9&&col<5)cls+='home-green ';if(r>9&&col>9)cls+='home-blue ';for(const p of LUDO_COLORS)if(p.lane.some(x=>x[0]===r&&x[1]===col))cls+=' '+p.finish+' ';if(r>=6&&r<=8&&col>=6&&col<=8)cls+='ludo-center ';const items=occupants[`${r},${col}`]||[];const pieces=items.map(({pl,n})=>`<span data-piece="${pl.you&&canPiece(pl.pieces,n)?n:''}" class="ludo-piece ${pl.you&&canPiece(pl.pieces,n)?'selectable':''}" style="--piece-color:${ludoTokenColor(pl)}">${n+1}</span>`).join('');return `<div class="${cls}" style="grid-row:${r+1};grid-column:${col+1}">${LUDO_SAFE.includes(idx)?'<span class="safe-star">★</span>':''}${pieces}</div>`}).join('');
const diceFace=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.max(1,Math.min(6,ludoDiceUI.rolling?ludoDiceUI.face:Number(st.lastRoll||1)))-1];const diceClass=ludoDiceUI.rolling?'dice-rolling':'';const guide=help?`<div class="ludo-guide"><b>راهنمای کوتاه</b><span>برای آوردن مهره از خانه، ۶ بیاور.</span><span>۶، گرفتن مهره و رسیدن به مقصد نوبت اضافه می‌دهد.</span><span>★ خانهٔ امن است و مهره در آن زده نمی‌شود.</span></div>`:'';
c.innerHTML=`<div class="ludo-wrap"><div class="ludo-scene ${st.lastMove?.captured?'event-capture':st.lastMove?.reachedHome?'event-finish':st.lastMove?.safe?'event-safe':st.winner?'event-result':''}"><div class="ludo-header"><div><div class="ludo-kicker">MANO ROYAL DUEL</div><div class="ludo-heading">منچ سلطنتی</div></div><div class="ludo-tools"><label><input id="ludoHelp" type="checkbox" ${help?'checked':''}> راهنما</label><label><input id="ludoSound" type="checkbox" ${ludoSoundOn?'checked':''}> صدا</label></div></div><div class="ludo-board-shell"><div class="ludo-board">${cells}<div class="ludo-destination"><b>مقصد</b><span>۴ مهره</span></div>${playerHome(players[0])}${playerHome(players[1])}</div></div><div class="ludo-meta"><div class="turn-indicator" style="--turn-color:${activeColor}">${current?'نوبت توست':'نوبت حریف'} · مهره‌های رسیده: ${players[0].pieces.filter(x=>x===57).length}/4</div><div class="dice-stage"><div class="ludo-die ${diceClass}" aria-label="تاس">${diceFace}</div><span class="dice-caption">${ludoDiceUI.rolling?'در حال انداختن تاس…':st.lastRoll?'تاس '+st.lastRoll:'آمادهٔ تاس'}</span></div><button id="roll" class="btn ludo-roll" ${st.current!==s.player||st.pendingRoll||ludoDiceUI.rolling?'disabled':''}>${roll?'مهره را انتخاب کن':current?'تاس بینداز':'منتظر نوبت حریف...'}</button>${guide}</div></div></div>`;
$('ludoHelp')?.addEventListener('change',e=>{localStorage.setItem('mano_ludo_help',e.target.checked?'on':'off');drawLudo(s)});$('ludoSound')?.addEventListener('change',e=>{ludoSoundOn=e.target.checked;localStorage.setItem('mano_ludo_sound',ludoSoundOn?'on':'off');if(ludoSoundOn)ludoTone(420)});c.querySelectorAll('[data-piece]').forEach(x=>{if(x.dataset.piece!=='')x.addEventListener('click',async()=>{try{const from=Number(st.positions[s.player]?.[Number(x.dataset.piece)]??-1),to=from<0?0:from+roll;ludoAnim={player:Number(s.player),piece:Number(x.dataset.piece),from,to,started:Date.now(),duration:Math.max(500,(to-from)*500),lastStep:-1};render(await api('move',{piece:Number(x.dataset.piece)}))}catch(e){ludoAnim=null;showError(e)}})});$('roll')?.addEventListener('click',async()=>{if(ludoDiceUI.rolling)return;ludoDiceUI={rolling:true,face:1,started:Date.now()};ludoDiceSound();const timer=setInterval(()=>{ludoDiceUI.face=1+Math.floor(Math.random()*6);if(state)drawLudo(state)},120);setTimeout(async()=>{clearInterval(timer);try{ludoDiceUI.rolling=false;render(await api('roll'))}catch(e){ludoDiceUI.rolling=false;showError(e)}},3000)})}
function drawCards(s){const st=s.state,c=$('boardContent');c.innerHTML=`<div class="cards"><div class="playing-card">${st.lastCard?'🂠 '+st.lastCard:'🂠'}</div><div class="scoreline">تو ${st.scores[s.player]||0} — ${st.scores[s.opponent]||0} حریف</div><small>راند ${st.round}/10</small><button id="draw" class="btn" ${st.current!==s.player?'disabled':''}>کارت بکش</button></div>`;$('draw')?.addEventListener('click',async()=>{try{render(await api('draw'))}catch(e){showError(e)}})}function drawTruth(s){const st=s.state,c=$('boardContent'),myTurn=Number(st.current)===Number(s.player),mode=truthPrefs.mode||st.mode||'tod',rating=truthPrefs.rating||st.rating||'pg13';const modeLabel={tod:'حقیقت یا جرئت',truth:'فقط حقیقت',dare:'فقط جرئت'};const ratingLabel={pg:'دوستانه',pg13:'چالشی',adult:'۱۸+ صمیمی'};c.innerHTML=`<div class="truth-shell"><div class="truth-kicker">MANO TRUTH ARENA</div><div class="truth-title">حقیقت یا جرئت</div><div class="truth-settings"><button class="truth-pill ${mode==='tod'?'active':''}" data-mode="tod">حقیقت یا جرئت</button><button class="truth-pill ${mode==='truth'?'active':''}" data-mode="truth">فقط حقیقت</button><button class="truth-pill ${mode==='dare'?'active':''}" data-mode="dare">فقط جرئت</button><button class="truth-pill ${rating==='pg'?'active':''}" data-rating="pg">دوستانه</button><button class="truth-pill ${rating==='pg13'?'active':''}" data-rating="pg13">چالشی</button><button class="truth-pill ${rating==='adult'?'active':''}" data-rating="adult">۱۸+ صمیمی</button></div><div class="truth-card">${st.prompt?`<div class="truth-type">${st.promptType==='حقیقت'?'حقیقت':'جرئت'}</div><div class="truth-prompt">${esc(st.prompt)}</div>`:'<div class="truth-empty">برای شروع نوبت، حالت بازی را انتخاب کن و سوال یا چالش بگیر.</div>'}</div><div class="truth-actions"><button id="truthStart" class="truth-btn" ${myTurn?'':'disabled'}>${st.prompt?'تولید نوبت جدید':'شروع نوبت'}</button><button id="truthReroll" class="truth-btn alt" ${myTurn&&st.prompt?'':'disabled'}>تعویض سوال</button><button id="truthDone" class="truth-btn danger" ${myTurn&&st.prompt?'':'disabled'}>انجام شد؛ نوبت بعد</button><button id="truthEnd" class="truth-btn alt">پایان بازی</button></div><div class="truth-meter">${myTurn?'نوبت توست':'منتظر نوبت طرف مقابل'} · راند ${st.rounds||0} از ۱۰ · حالت: ${modeLabel[mode]} · سطح: ${ratingLabel[rating]}${rating==='adult'?' · سوال‌ها صمیمی، غیرصریح و با رضایت؛ جرئت‌های ۱۸+ فعلاً بدون تغییر':''}</div></div>`;let selectedMode=mode,selectedRating=rating;c.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{selectedMode=x.dataset.mode;truthPrefs.mode=selectedMode;c.querySelectorAll('[data-mode]').forEach(y=>y.classList.toggle('active',y===x))});c.querySelectorAll('[data-rating]').forEach(x=>x.onclick=()=>{selectedRating=x.dataset.rating;truthPrefs.rating=selectedRating;c.querySelectorAll('[data-rating]').forEach(y=>y.classList.toggle('active',y===x))});const truthAction=async(button,command)=>{if(!button||button.disabled)return;button.disabled=true;try{render(await api('truth',{command,mode:selectedMode,rating:selectedRating}))}catch(e){button.disabled=false;showError(e)}};$('truthStart')?.addEventListener('click',()=>truthAction($('truthStart'),'start'));$('truthReroll')?.addEventListener('click',()=>truthAction($('truthReroll'),'reroll'));$('truthDone')?.addEventListener('click',()=>truthAction($('truthDone'),'complete'));$('truthEnd')?.addEventListener('click',async()=>{if(!window.confirm('بازی برای هر دو نفر پایان داده شود؟'))return;try{render(await api('leave'))}catch(e){showError(e)}})}
$('ready').onclick=async()=>{if(state?.status==='finished'){location.reload();return}try{render(await api('ready'))}catch(e){showError(e)}};$('leave').onclick=async()=>{try{await api('leave')}catch{}window.close();$('overlayText').textContent='از بازی خارج شدی.'};async function sendChat(){const i=$('chatInput');const text=i.value.trim();if(!text||window.__sendingChat)return;window.__sendingChat=true;try{if(editingMessageId!==null){const next=await api('edit',{messageId:editingMessageId,text});render(next);editingMessageId=null;i.value='';$('chatSend').textContent='ارسال';return}const replyId=replyTarget&&Number.isSafeInteger(Number(replyTarget.id))?Number(replyTarget.id):null;const next=await api('chat',{text,replyTo:replyId});render(next);i.value='';replyTarget=null;$('replyPreview').classList.add('hide');$('replyPreview span').textContent=''}catch(e){showError(e)}finally{window.__sendingChat=false}}$('chatSend').onclick=sendChat;$('chatInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}};load();setInterval(load,1300)})();
