<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ManoChat Duel</title><style>
:root{--bg:#07111f;--panel:#101e31;--panel2:#172b45;--line:#ffffff1c;--text:#f5f7fb;--muted:#9fb0c7;--cyan:#67e8f9;--gold:#fbbf24;--pink:#fb7185;--green:#4ade80}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Vazirmatn,system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#1e4162 0,#07111f 52%);min-height:100vh}.app{max-width:1080px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;font-weight:800}.title{font-size:28px;font-weight:900;margin-top:2px}.room{font-size:11px;color:var(--muted);direction:ltr}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.panel{background:#ffffff09;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 20px 70px #0005}.status{padding:12px;border-radius:15px;background:#ffffff0a;color:#dbeafe;text-align:center;margin-bottom:12px}.board{min-height:470px;border-radius:20px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);display:grid;place-items:center;position:relative;overflow:hidden}.board:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:34px 34px}.content{position:relative;width:100%;z-index:1}.btn{border:0;border-radius:13px;padding:12px 16px;background:linear-gradient(135deg,#ffe08a,#f59e0b);color:#241606;font-weight:900;cursor:pointer}.btn.alt{background:#ffffff0c;color:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.chat{height:470px;display:flex;flex-direction:column}.chat h3{margin:0 0 10px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:5px}.msg{max-width:88%;background:#ffffff0c;border:1px solid var(--line);padding:8px 10px;border-radius:13px;font-size:13px}.msg.mine{align-self:flex-start;background:#0e7490aa}.msg.theirs{align-self:flex-end;background:#9f1239aa}.compose{display:flex;gap:7px;margin-top:10px}.compose input{min-width:0;flex:1;border:1px solid var(--line);background:#0003;color:#fff;border-radius:12px;padding:11px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#07111fdd;backdrop-filter:blur(9px)}.card{max-width:390px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:25px}.card h2{margin:0 0 8px}.card p{color:var(--muted);line-height:1.8;font-size:13px}.hide{display:none}.ludo{display:grid;grid-template-columns:repeat(6,45px);gap:6px;justify-content:center}.cell{width:45px;height:45px;border-radius:12px;background:#ffffff0d;border:1px solid var(--line);display:grid;place-items:center;font-size:22px}.piece{background:var(--cyan);color:#06222c;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:900}.piece.two{background:var(--pink);color:#300813}.chess{display:grid;grid-template-columns:repeat(8,min(10vw,58px));direction:ltr;border:7px solid #9a6b38;border-radius:10px;box-shadow:0 14px 35px #0008}.sq{aspect-ratio:1;display:grid;place-items:center;font-size:min(8vw,39px);cursor:pointer}.sq.light{background:#f3dfb0}.sq.dark{background:#85603c}.sq.selected{outline:4px solid var(--gold);outline-offset:-4px}.cards{display:flex;flex-direction:column;align-items:center;gap:15px}.playing-card{width:145px;height:205px;border-radius:18px;background:linear-gradient(145deg,#fff,#dbeafe);color:#16233d;display:grid;place-items:center;font-size:62px;box-shadow:0 16px 40px #0008}.scoreline{font-size:20px;font-weight:800}.truth{max-width:560px;margin:auto;text-align:center}.prompt{font-size:23px;font-weight:800;line-height:1.8;min-height:130px;display:grid;place-items:center}.meter{color:var(--muted);font-size:13px}small{color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.chat{height:300px}.board{min-height:420px}.ludo{grid-template-columns:repeat(6,38px)}.cell{width:38px;height:38px}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">MANOCHAT DUEL ROOM</div><div class="title" id="title">بازی دونفره</div><div class="room" id="room"></div></div><div id="emoji" style="font-size:38px">🎮</div></header><div class="grid"><section class="panel"><div id="status" class="status">در حال اتصال...</div><div id="board" class="board"><div id="boardContent" class="content"></div><div id="overlay" class="overlay"><div class="card"><h2 id="overlayTitle">اتاق بازی</h2><p id="overlayText">در حال هماهنگ‌سازی دو بازیکن...</p><button id="ready" class="btn">آماده‌ام</button><button id="leave" class="btn alt">خروج</button></div></div></div></section><aside class="panel chat"><h3>گفت‌وگوی داخل بازی</h3><div id="messages" class="messages"></div><div class="compose"><input id="chatInput" maxlength="300" placeholder="پیام خودت را بنویس..."><button id="chatSend" class="btn">ارسال</button></div></aside></div></main><script>
(()=>{const q=new URLSearchParams(location.search),room=q.get('room'),player=Number(q.get('player')),token=q.get('token');let state=null,selected=null,poll;const $=id=>document.getElementById(id);$('room').textContent=room?`اتاق ${room.slice(0,8)}`:'';const api=async(action,payload={})=>{const r=await fetch('/api/game/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,player,token,action,...payload})});const j=await r.json();if(!r.ok)throw new Error(j.error||'game_error');return j.state};async function load(){try{const r=await fetch(`/api/game/state?room=${encodeURIComponent(room)}&player=${player}&token=${encodeURIComponent(token)}`);const j=await r.json();if(!r.ok)throw new Error();render(j.state)}catch{fail('اتاق بازی پیدا نشد یا منقضی شده است.')}}function fail(t){$('status').textContent=t;$('overlay').classList.remove('hide');$('overlayTitle').textContent='بازی در دسترس نیست';$('overlayText').textContent=t;$('ready').disabled=true}function render(s){state=s;$('title').textContent=s.emoji+' '+s.title;$('emoji').textContent=s.emoji;renderChat(s.messages);if(s.status==='waiting'){$('overlay').classList.remove('hide');$('overlayTitle').textContent='آمادهٔ شروع؟';$('overlayText').textContent=s.opponentReady?'طرف مقابل آماده است؛ تو هم آماده شو.':'منتظر آماده‌شدن طرف مقابل هستیم.';$('ready').disabled=s.ready;$('ready').textContent=s.ready?'منتظر طرف مقابل...':'آماده‌ام';$('status').textContent=s.opponentReady?'هر دو نفر باید آماده شوند.':'درخواست بازی پذیرفته شده؛ آماده شو.'}else if(s.status==='active'){$('overlay').classList.add('hide');$('status').textContent=Number(s.state.current)===player?'نوبت توست':'نوبت طرف مقابل است';drawGame(s)}else{$('overlay').classList.remove('hide');$('ready').textContent='شروع دوباره';$('ready').disabled=false;$('overlayTitle').textContent=s.status==='finished'?'بازی تمام شد':'بازی بسته شد';$('overlayText').textContent=s.state.winner===player?'برنده شدی!':s.state.winner?'این دور را باختی.':'بازی مساوی شد.';$('status').textContent='نتیجه ثبت شد';drawGame(s)}}function renderChat(items){$('messages').innerHTML=items.map(m=>`<div class="msg ${m.sender===player?'mine':'theirs'}">${escapeHtml(m.text)}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawGame(s){const c=$('boardContent'),g=s.game,st=s.state;if(g==='ludo')c.innerHTML=`<div class="ludo">${Array.from({length:36},(_,i)=>`<button class="cell" data-cell="${i}">${i%6===0?'🏁':''}</button>`).join('')}</div><div style="text-align:center;margin-top:18px">تو: ${st.positions[player]||0} / 30 &nbsp; | &nbsp; طرف مقابل: ${st.positions[s.opponent]||0} / 30<br><small>${st.lastRoll?'آخرین تاس: '+st.lastRoll:'با هر نوبت تاس بینداز'}</small></div>`;else if(g==='cards')c.innerHTML=`<div class="cards"><div class="playing-card">${st.lastCard?'🂠 '+st.lastCard:'🂠'}</div><div class="scoreline">تو ${st.scores[player]||0} — ${st.scores[s.opponent]||0} طرف مقابل</div><small>راند ${st.round}/10</small><button class="btn" id="draw" ${st.current!==player?'disabled':''}>کارت بکش</button></div>`;else if(g==='truth')c.innerHTML=`<div class="truth"><div class="prompt">${st.prompt?escapeHtml(st.prompt):'برای شروع نوبتت را اجرا کن'}</div><div class="meter">راند ${st.rounds}/6</div><div class="actions"><button class="btn" id="truth" ${st.current!==player?'disabled':''}>${st.prompt?'انجام شد؛ نوبت بعد':'حقیقت یا جرئت'}</button></div></div>`;else drawChess(c,s)}function drawChess(c,s){const b=s.state.board;c.innerHTML=`<div class="chess">${b.flatMap((row,r)=>row.map((p,col)=>`<button class="sq ${(r+col)%2?'dark':'light'} ${selected&&selected.r===r&&selected.c===col?'selected':''}" data-r="${r}" data-c="${col}">${piece(p)}</button>`)).join('')}</div><div style="text-align:center;margin-top:12px"><small>مهرهٔ خودت را انتخاب کن و خانهٔ مقصد را بزن.</small></div>`;c.querySelectorAll('.sq').forEach(x=>x.onclick=()=>chessClick(Number(x.dataset.r),Number(x.dataset.c)))}function piece(p){return ({wp:'♙',wr:'♖',wn:'♘',wb:'♗',wq:'♕',wk:'♔',bp:'♟',br:'♜',bn:'♞',bb:'♝',bq:'♛',bk:'♚'}[p]||'')}async function chessClick(r,c){if(!state||state.state.current!==player)return;if(!selected){if(state.state.board[r][c]?.[0]===(player===state.player?'w':'b')){selected={r,c};drawGame(state)}return}try{state=await api('move',{from:selected,to:{r,c}});selected=null;render(state)}catch{selected=null;render(state)}}$('ready').onclick=async()=>{if(state?.status==='finished'){location.reload();return}try{render(await api('ready'))}catch{fail('ارتباط با اتاق قطع شد.')}};$('leave').onclick=async()=>{try{await api('leave')}catch{}window.close();fail('از بازی خارج شدی.')};$('board').onclick=async e=>{if(e.target.id==='draw')try{render(await api('draw'))}catch{}if(e.target.id==='truth')try{render(await api('truth'))}catch{}if(e.target.dataset.cell&&state?.game==='ludo'&&state.state.current===player)try{render(await api('move'))}catch{}};$('chatSend').onclick=sendChat;$('chatInput').onkeydown=e=>{if(e.key==='Enter')sendChat()};async function sendChat(){const input=$('chatInput');if(!input.value.trim())return;try{render(await api('chat',{text:input.value.trim()}));input.value=''}catch{}};load();poll=setInterval(load,1200);addEventListener('beforeunload',()=>clearInterval(poll))})();
</script></body></html>
