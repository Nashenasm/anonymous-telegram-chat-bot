function drawCards(s){const st=s.state,c=$('boardContent');c.innerHTML=`<div class="cards"><div class="playing-card">${st.lastCard?'🂠 '+st.lastCard:'🂠'}</div><div class="scoreline">تو ${st.scores[s.player]||0} — ${st.scores[s.opponent]||0} حریف</div><small>راند ${st.round}/10</small><button id="draw" class="btn" ${st.current!==s.player?'disabled':''}>کارت بکش</button></div>`;$('draw')?.addEventListener('click',async()=>{try{render(await api('draw'))}catch(e){showError(e)}})}function drawTruth(s){const st=s.state,c=$('boardContent'),myTurn=Number(st.current)===Number(s.player),mode=truthPrefs.mode||st.mode||'tod',rating=truthPrefs.rating||st.rating||'pg13';const modeLabel={tod:'حقیقت یا جرئت',truth:'فقط حقیقت',dare:'فقط جرئت'};const ratingLabel={pg:'دوستانه',pg13:'چالشی',adult:'۱۸+ صمیمی'};c.innerHTML=`<div class="truth-shell"><div class="truth-kicker">MANO TRUTH ARENA</div><div class="truth-title">حقیقت یا جرئت</div><div class="truth-settings"><button class="truth-pill ${mode==='tod'?'active':''}" data-mode="tod">حقیقت یا جرئت</button><button class="truth-pill ${mode==='truth'?'active':''}" data-mode="truth">فقط حقیقت</button><button class="truth-pill ${mode==='dare'?'active':''}" data-mode="dare">فقط جرئت</button><button class="truth-pill ${rating==='pg'?'active':''}" data-rating="pg">دوستانه</button><button class="truth-pill ${rating==='pg13'?'active':''}" data-rating="pg13">چالشی</button><button class="truth-pill ${rating==='adult'?'active':''}" data-rating="adult">۱۸+ صمیمی</button></div><div class="truth-card">${st.prompt?`<div class="truth-type">${st.promptType==='حقیقت'?'حقیقت':'جرئت'}</div><div class="truth-prompt">${esc(st.prompt)}</div>`:'<div class="truth-empty">برای شروع نوبت، حالت بازی را انتخاب کن و سوال یا چالش بگیر.</div>'}</div><div class="truth-actions"><button id="truthStart" class="truth-btn" ${myTurn?'':'disabled'}>${st.prompt?'تولید نوبت جدید':'شروع نوبت'}</button><button id="truthReroll" class="truth-btn alt" ${myTurn&&st.prompt?'':'disabled'}>تعویض سوال</button><button id="truthDone" class="truth-btn danger" ${myTurn&&st.prompt?'':'disabled'}>انجام شد؛ نوبت بعد</button></div><div class="truth-meter">${myTurn?'نوبت توست':'منتظر نوبت طرف مقابل'} · راند ${st.rounds||0} از ۱۰ · حالت: ${modeLabel[mode]} · سطح: ${ratingLabel[rating]}${rating==='adult'?' · سوال‌ها صمیمی، غیرصریح و با رضایت؛ جرئت‌های ۱۸+ فعلاً بدون تغییر':''}</div></div>`;let selectedMode=mode,selectedRating=rating;c.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{selectedMode=x.dataset.mode;truthPrefs.mode=selectedMode;c.querySelectorAll('[data-mode]').forEach(y=>y.classList.toggle('active',y===x))});c.querySelectorAll('[data-rating]').forEach(x=>x.onclick=()=>{selectedRating=x.dataset.rating;truthPrefs.rating=selectedRating;c.querySelectorAll('[data-rating]').forEach(y=>y.classList.toggle('active',y===x))});const truthAction=async(button,command)=>{if(!button||button.disabled)return;button.disabled=true;try{render(await api('truth',{command,mode:selectedMode,rating:selectedRating}))}catch(e){button.disabled=false;showError(e)}};$('truthStart')?.addEventListener('click',()=>truthAction($('truthStart'),'start'));$('truthReroll')?.addEventListener('click',()=>truthAction($('truthReroll'),'reroll'));$('truthDone')?.addEventListener('click',()=>truthAction($('truthDone'),'complete'))}
$('ready').onclick=async()=>{if(state?.status==='finished'){location.reload();return}try{render(await api('ready'))}catch(e){showError(e)}};$('leave').onclick=async()=>{try{await api('leave')}catch{}window.close();$('overlayText').textContent='از بازی خارج شدی.'};function clearComposer(){replyTarget=null;editingMessage=null;$('chatInput').value='';$('chatInput').classList.remove('edit-mode');$('chatSend').textContent='ارسال';$('composePreview').classList.add('hide');$('editLabel').classList.add('hide')}function setReply(id){const m=messageById(id);if(!m)return;editingMessage=null;replyTarget=m;$('chatInput').focus();$('composePreview').innerHTML=`↩ پاسخ به: ${esc(m.text.slice(0,90))}<button data-action="cancel-compose">×</button>`;$('composePreview').classList.remove('hide')}function setEdit(id){const m=messageById(id);if(!m||Number(m.sender)!==player)return;editingMessage=m;$('chatInput').value=m.text;$('chatInput').focus();$('chatInput').classList.add('edit-mode');$('chatSend').textContent='ذخیره';$('editLabel').classList.remove('hide');$('composePreview').classList.add('hide')}async function sendChat(){const i=$('chatInput');if(!i.value.trim())return;try{const action=editingMessage?'edit_message':'chat';const payload=editingMessage?{messageId:editingMessage.id,text:i.value.trim()}:{text:i.value.trim(),...(replyTarget?{replyToId:replyTarget.id}:{})};render(await api(action,payload));clearComposer()}catch(e){showError(e)}}$('messages').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==='reply')return setReply(id);if(action==='edit')return setEdit(id);if(action==='cancel-compose')return clearComposer();if(action==='delete'){if(!confirm('این پیام برای هر دو نفر حذف شود؟'))return;try{render(await api('delete_message',{messageId:id}))}catch(e){showError(e)}return}if(action==='react-menu'){const row=document.querySelector(`[data-reactions-for="${id}"]`);row?.classList.toggle('hide');return}if(action==='react'){try{render(await api('reaction',{messageId:id,emoji:b.dataset.emoji}))}catch(e){showError(e)}}};$('chatSend').onclick=sendChat;$('chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}};load();setInterval(load,1300)})();
</script></body></html>
