$('ready').onclick=async()=>{if(state?.status==='finished'){location.reload();return}try{render(await api('ready'))}catch(e){showError(e)}};async function leaveCurrentGame(ask=true){if(!state||state.status==='finished'||state.status==='cancelled')return;if(ask&&!window.confirm('با خروج، بازی و گفت‌وگوی این اتاق برای هر دو نفر پایان می‌یابد. خارج شوی؟'))return;window.__leavingGame=true;try{render(await api('leave'))}catch(e){window.__leavingGame=false;showError(e)}}$('leave').onclick=()=>leaveCurrentGame(false);$('leaveGame').onclick=()=>leaveCurrentGame(true);window.addEventListener('pagehide',()=>{if(!state||!['active','waiting'].includes(state.status)||window.__leavingGame||window.__leftGameSignal)return;window.__leftGameSignal=true;const payload=JSON.stringify({room,player,token,action:'leave'});if(navigator.sendBeacon){navigator.sendBeacon('/api/game/action',new Blob([payload],{type:'application/json'}))}else fetch('/api/game/action',{method:'POST',headers:{'content-type':'application/json'},body:payload,keepalive:true}).catch(()=>{})});async function sendChat(){const i=$('chatInput');const text=i.value.trim();if(!text||window.__sendingChat)return;window.__sendingChat=true;try{if(editingMessageId!==null){const next=await api('edit',{messageId:editingMessageId,text});render(next);editingMessageId=null;i.value='';$('chatSend').textContent='ارسال';return}const replyId=replyTarget&&Number.isSafeInteger(Number(replyTarget.id))?Number(replyTarget.id):null;const next=await api('chat',{text,replyTo:replyId});render(next);i.value='';replyTarget=null;$('replyPreview').classList.add('hide');$('replyPreview span').textContent=''}catch(e){showError(e)}finally{window.__sendingChat=false}}$('chatSend').onclick=sendChat;$('chatInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}};load();setInterval(load,750)})();
</script></body></html>
