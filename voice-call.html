<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تماس صوتی ناشناس</title><style>body{font-family:system-ui;background:#101827;color:#f8fafc;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(92vw,420px);background:#182338;border:1px solid #334155;border-radius:22px;padding:26px;box-sizing:border-box;text-align:center}button{border:0;border-radius:12px;padding:13px 20px;background:#22c55e;color:#06250f;font-weight:700;font-size:16px;margin:6px;cursor:pointer}button.danger{background:#ef4444;color:white}button:disabled{opacity:.5}#status{min-height:48px;color:#cbd5e1;line-height:1.8}small{color:#94a3b8}audio{width:100%;margin-top:18px}</style><body><main class="card"><h2>تماس صوتی ناشناس</h2><p id="status">برای شروع تماس، اجازهٔ میکروفون را بده.</p><button id="start">شروع تماس</button><button id="mute" disabled>بی‌صدا</button><button id="end" class="danger" disabled>پایان تماس</button><audio id="remote" autoplay controls></audio><p><small>نام، شماره و آیدی تلگرام طرف مقابل نمایش داده نمی‌شود. تماس ضبط نمی‌شود.</small></p></main><script>
const qs=new URLSearchParams(location.search),room=qs.get('room'),token=qs.get('token');let pc,stream,seq=0,polling,started=false;
let voiceChannel=null;try{voiceChannel=new BroadcastChannel('mano-voice-'+room);voiceChannel.onmessage=e=>{if(e.data?.type==='control'&&e.data.command==='mute')$('mute').click();if(e.data?.type==='control'&&e.data.command==='end')end()}}catch{}
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
async function signal(type,data=null){const r=await fetch('/api/voice/signal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,token,type,data})});if(!r.ok)throw Error('signal');return r.json()}
async function poll(){try{const r=await fetch(`/api/voice/signal?room=${encodeURIComponent(room)}&token=${encodeURIComponent(token)}&after=${seq}`);const j=await r.json();if(!j.ok)return;seq=j.seq;for(const m of j.messages){if(!pc)continue;if(m.type==='offer'){await pc.setRemoteDescription(m.data);const a=await pc.createAnswer();await pc.setLocalDescription(a);await signal('answer',pc.localDescription)}else if(m.type==='answer'){await pc.setRemoteDescription(m.data)}else if(m.type==='ice'&&m.data)try{await pc.addIceCandidate(m.data)}catch{}}}catch{} }
async function start(){if(started)return;started=true;$('start').disabled=true;$('end').disabled=false;$('mute').disabled=false;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});pc=new RTCPeerConnection({iceServers:[]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{ $('remote').srcObject=e.streams[0] };pc.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate).catch(()=>{})};polling=setInterval(poll,700);await signal('ready');status('در انتظار اتصال طرف مقابل…');setTimeout(async()=>{if(!pc)return;const o=await pc.createOffer();await pc.setLocalDescription(o);await signal('offer',pc.localDescription);status('تماس برقرار شد یا در حال برقراری است…')},1000)}catch(e){started=false;$('start').disabled=false;$('end').disabled=true;$('mute').disabled=true;status('دسترسی به میکروفون ممکن نشد؛ مجوز مرورگر را بررسی کن.')}}
function end(){clearInterval(polling);stream?.getTracks().forEach(t=>t.stop());pc?.close();signal('leave').catch(()=>{});$('end').disabled=true;$('mute').disabled=true;status('تماس پایان یافت.');}
$('start').onclick=start;$('end').onclick=end;$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'بی‌صدا':'فعال‌کردن صدا'}};if(!room||!token){$('start').disabled=true;status('لینک تماس معتبر نیست. از داخل چت دوباره درخواست تماس بده.')}window.addEventListener('pagehide',()=>{}); document.addEventListener('visibilitychange',()=>{if(started && document.visibilityState==='visible') poll();});
</script></body></html>
